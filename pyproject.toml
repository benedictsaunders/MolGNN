[project]
name = "molgnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benedict Saunders", email = "benedictsaunders@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "torch>=2.4.0",
    "torchvision",
    "torch_geometric",
    "pytorch-triton-rocm ; sys_platform == 'linux'",
    "triton-rocm ; sys_platform == 'linux'",
    "ase>=3.29.0",
    "tqdm>=4.70.0",
    "mace-torch>=0.3.16",
    "e3nn>=0.4.4",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]

[project.scripts]
molgnn = "molgnn:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["qm9: needs the real QM9 dataset on disk (skipped otherwise)"]
filterwarnings = [
    "ignore::FutureWarning:e3nn.*",
    "ignore:The TorchScript type system:UserWarning",
]
